[package]
name = "fluxum-sdk"
description = "Fluxum Rust client SDK: typed tables, reducer calls, and live subscriptions over FluxRPC (SPEC-011 SDK-050)"
# The server and every SDK share ONE version — the release train moves
# together (owner rule, 2026-07-29). `tests/version_sync.rs` enforces it
# against the workspace manifest and the four sibling SDK manifests; the Go
# SDK rides the same number as its git tag (v<version> on hivellm/fluxum-go).
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["fluxum", "realtime", "database", "client", "sdk"]
categories = ["database", "network-programming", "api-bindings"]
# Local test/dev residue (a conformance run writes ./data) must never ship
# in the crate archive.
exclude = ["data/"]

# Deliberately depends on nothing internal: `src/protocol/` is vendored from
# `crates/fluxum-protocol` (see that module's docs) so this crate publishes on
# its own, without releasing an internal server crate to crates.io alongside it.
[dependencies]
# RPC-008 stream decompression, only under the `compression` feature — the
# default client stays zero-extra-dep and simply never negotiates gzip.
flate2 = { workspace = true, optional = true }
rmp-serde.workspace = true
serde.workspace = true
serde_bytes.workspace = true
thiserror.workspace = true
thunder-rpc.workspace = true

[features]
# Opt into negotiating the RPC-008 gzip stream (WirePreferences::compression).
compression = ["dep:flate2"]

# Test-only: the conformance runner (tests/conformance.rs) reads the shared
# JSON corpus (tests/conformance/ at the repo root). Not a runtime dependency
# — the published client carries none of this.
[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
